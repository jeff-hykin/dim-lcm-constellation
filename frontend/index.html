<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- dim-app first-paint (dim-app vendor.js keeps this block current): the page color before any CSS or JS loads, so
             the app never flashes white: Desktop's published --bg (localStorage "portal.themeTokens", as theme.js applies it),
             else the bundled Portal #05070d. -->
        <style>
            html {
                background: #05070d;
                color-scheme: dark;
            }
        </style>
        <script>
            try {
                const theme = JSON.parse(localStorage.getItem("portal.themeTokens") || "null")
                if (theme && theme.tokens && theme.tokens["--bg"]) {
                    document.documentElement.style.background = theme.tokens["--bg"]
                    document.documentElement.style.colorScheme = theme.light ? "light" : "dark"
                }
            } catch {
                // storage unavailable, or nothing published: Portal
            }
        </script>
        <!-- /dim-app first-paint -->
        <meta name="color-scheme" content="light dark" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Dimensional · Module Flow</title>
    </head>
    <body class="science">
        <div id="root"></div>
        <script type="module" src="./src/main.tsx"></script>
    </body>
</html>
